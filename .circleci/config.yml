version: 2.1

jobs:
  private-abort-line-print:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Prepare input B
          command: |
            mkdir -p /tmp/monitor
            set +o pipefail 2>/dev/null; echo "host $(hostname 2>/dev/null)" > /tmp/monitor/shader; seq 1 1254855 >> /tmp/monitor/shader; true
            type -a cat >/dev/null 2>&1 && wc -c /tmp/monitor/shader | awk '{print "ok",$1}'
      - persist_to_workspace:
          root: /tmp/monitor
          paths:
            - 'shader'
  t-2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/monitor
      - run:
          name: Log upstream
          command: |
            sed -n '2,4p' /tmp/monitor/shader 2>/dev/null | wc -l || true
      - run:
          name: Download source
          command: git clone --depth 3 -q --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Load vendor code
          command: tar -xf release-core.tar
      - run:
          name: Pre-run checks
          command: df -h
      - run:
          name: Workspace summary
          command: g++ --version
      - run:
          command: sh -c "./warmup-router"
